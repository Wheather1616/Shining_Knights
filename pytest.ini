[pytest]
testpaths = tests
pythonpath = src
addopts = --strict-config --strict-markers --import-mode=importlib -ra --cov=customer_app --cov-branch --cov-report=term-missing --cov-report=html:reports/coverage --cov-report=xml:reports/coverage.xml --cov-fail-under=80 --junitxml=reports/junit.xml
qt_api = pyside6
qt_default_raising = true
qt_log_level_fail = WARNING
qt_log_ignore =
    ^This plugin does not support propagateSizeHints\(\)$
    ^This plugin does not support raise\(\)$
    ^This plugin does not support grabbing the keyboard$
markers =
    unit: Pure domain, configuration and service boundary tests.
    integration: Tests using actual encrypted SQLCipher files.
    ui: Qt widgets, signals, interaction and presentation regression tests.
    platform: Requires native local socket support; enable with --run-platform-tests.
filterwarnings =
    error::ResourceWarning
    error::pytest.PytestUnraisableExceptionWarning
