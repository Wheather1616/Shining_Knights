[project]
name = "Shining Knights"
version = "0.1.0"
description = "Windows based application for managing customer details"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "openpyxl>=3.1",
    "python-dateutil>=2.9",
    "pyinstaller>=6.0",
    "sqlcipher3>=0.6.2",
    "keyring>=25.7.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
shiningKnights = "customer_app.app:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
